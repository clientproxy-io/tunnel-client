name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.9.3)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build Linux musl binaries ─────────────────────────────────────
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
          # 32-bit ARM: older Synology/QNAP ARM models, Raspberry Pi OS 32-bit
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-

      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross build --bin tunnel-client --target ${{ matrix.target }} --release

      - name: Strip binary
        run: strip --strip-all target/${{ matrix.target }}/release/tunnel-client 2>/dev/null || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/tunnel-client

  # ── Build Windows binary ──────────────────────────────────────────
  build-windows:
    name: Build (windows-amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Windows installer syntax
        shell: pwsh
        run: |
          foreach ($script in @('scripts/windows-install.ps1', 'scripts/windows-uninstall.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw ($parseErrors | Out-String)
            }
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-pc-windows-msvc-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-x86_64-pc-windows-msvc-

      - name: Build
        run: cargo build --bin tunnel-client --target x86_64-pc-windows-msvc --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows-amd64
          path: target/x86_64-pc-windows-msvc/release/tunnel-client.exe

  # ── Package .deb and .rpm ─────────────────────────────────────────
  package:
    name: Package (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "num=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: bin/

      - name: Install fpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install fpm --no-document

      - name: Create packages
        run: |
          chmod 755 bin/tunnel-client
          chmod +x scripts/postinst-tunnel-client.sh scripts/prerm-tunnel-client.sh

          ARCH=${{ matrix.arch }}
          VER=${{ steps.ver.outputs.num }}
          DESC="clientproxy.io tunnel client — expose local backends through a secure reverse-proxy tunnel"

          mkdir -p pkg/usr/local/bin pkg/lib/systemd/system
          cp bin/tunnel-client               pkg/usr/local/bin/
          cp scripts/tunnel-client.service   pkg/lib/systemd/system/

          # .deb
          fpm -s dir -t deb \
            -n tunnel-client -v "$VER" \
            --architecture "$ARCH" \
            --depends ca-certificates \
            --maintainer "clientproxy.io <info@clientproxy.io>" \
            --description "$DESC" \
            --after-install  scripts/postinst-tunnel-client.sh \
            --before-remove  scripts/prerm-tunnel-client.sh \
            -p "tunnel-client_${VER}_${ARCH}.deb" \
            -C pkg \
            usr/local/bin/tunnel-client \
            lib/systemd/system/tunnel-client.service

          # .rpm  (fpm maps amd64 → x86_64, arm64 → aarch64 automatically)
          fpm -s dir -t rpm \
            -n tunnel-client -v "$VER" \
            --architecture "$ARCH" \
            --depends ca-certificates \
            --maintainer "clientproxy.io <info@clientproxy.io>" \
            --description "$DESC" \
            --after-install  scripts/postinst-tunnel-client.sh \
            --before-remove  scripts/prerm-tunnel-client.sh \
            -p "tunnel-client-${VER}-1.${ARCH}.rpm" \
            -C pkg \
            usr/local/bin/tunnel-client \
            lib/systemd/system/tunnel-client.service

          ls -lh *.deb *.rpm

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            *.deb
            *.rpm

  # ── Synology DSM 7 package (.spk, all CPUs in one file) ──────────
  package-synology:
    name: Package (synology)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Synology package versioning
        run: python3 packaging/synology/test-build-spk.py

      - name: Get version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "num=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries/

      - name: Build .spk
        run: |
          mkdir -p bin
          for arch in amd64 arm64 armv7; do
            cp "binaries/binary-${arch}/tunnel-client" "bin/tunnel-client-linux-${arch}"
          done
          packaging/synology/build-spk.sh "${{ steps.ver.outputs.num }}" bin .

      - name: Upload .spk
        uses: actions/upload-artifact@v4
        with:
          name: packages-synology
          path: |
            *.spk
            synology-feed.json

  # ── Multi-arch container image → GHCR ─────────────────────────────
  docker:
    name: Container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/clientproxy-io/tunnel-client
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "num=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries/

      - name: Lay out build context by platform
        run: |
          install -D -m 0755 binaries/binary-amd64/tunnel-client ctx/linux/amd64/tunnel-client
          install -D -m 0755 binaries/binary-arm64/tunnel-client ctx/linux/arm64/tunnel-client
          install -D -m 0755 binaries/binary-armv7/tunnel-client ctx/linux/arm/v7/tunnel-client

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.num }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=tunnel-client
            org.opencontainers.image.description=clientproxy.io tunnel client
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.num }}
            org.opencontainers.image.licenses=MIT

  # ── Create GitHub Release ─────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [package, package-synology, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "num=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release/

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: false
          path: binaries/

      - name: Package all binaries for release
        run: |
          mkdir -p release
          VER=${{ steps.ver.outputs.num }}
          # Linux raw binaries
          mv binaries/binary-amd64/tunnel-client   release/tunnel-client-linux-amd64  2>/dev/null || true
          mv binaries/binary-arm64/tunnel-client   release/tunnel-client-linux-arm64  2>/dev/null || true
          mv binaries/binary-armv7/tunnel-client   release/tunnel-client-linux-armv7  2>/dev/null || true
          # Windows installer zip, including service wrapper and configuration migration.
          mkdir -p windows-package
          cp binaries/binary-windows-amd64/tunnel-client.exe windows-package/
          cp scripts/windows-install.ps1 windows-package/install.ps1
          cp scripts/windows-uninstall.ps1 windows-package/uninstall.ps1
          cp scripts/tunnel-client-svc.xml windows-package/
          curl -fsSL "https://github.com/winsw/winsw/releases/download/v3.0.0-alpha.11/WinSW-x64.exe" \
            -o windows-package/tunnel-client-svc.exe
          (cd windows-package && zip -q -r "../release/tunnel-client-windows-${VER}.zip" .)
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Release ${{ steps.ver.outputs.tag }}
          # Publish directly rather than creating a draft — draft releases are
          # invisible to users and to /releases/latest, and in practice they sat
          # unpublished. The tag is the deliberate act; treat it as the go-ahead.
          draft: false
          make_latest: true
          generate_release_notes: true
          files: release/*

  # ── Check whether GCP credentials are available ──────────────────
  check-gcp:
    name: Check GCP credentials
    needs: package
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Publish to Google Artifact Registry ──────────────────────────
  publish-gar:
    name: Publish to Google Artifact Registry
    needs: [package, check-gcp]
    runs-on: ubuntu-latest
    if: needs.check-gcp.outputs.has-key == 'true'
    env:
      PROJECT: proxyconfig-71f70
      LOCATION: us-central1
    steps:
      - name: Get version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "num=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: pkgs/

      - name: Push .deb packages
        run: |
          VER=${{ steps.ver.outputs.num }}
          for arch in amd64 arm64; do
            DEB="pkgs/tunnel-client_${VER}_${arch}.deb"
            echo "Uploading ${DEB}..."
            gcloud artifacts apt upload tunnel-client-apt \
              --location="$LOCATION" \
              --source="$DEB"
          done

      - name: Push .rpm packages
        run: |
          VER=${{ steps.ver.outputs.num }}
          for arch in amd64 arm64; do
            RPM="pkgs/tunnel-client-${VER}-1.${arch}.rpm"
            echo "Uploading ${RPM}..."
            gcloud artifacts yum upload tunnel-client-yum \
              --location="$LOCATION" \
              --source="$RPM"
          done
